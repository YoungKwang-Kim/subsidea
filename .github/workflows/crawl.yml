name: crawl-grants

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/crawl.yml'
      - 'scripts/**'
      - 'tests/test_crawler_normalizer.py'
      - 'requirements.txt'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: python -m pip install -r requirements.txt

      - name: Run crawler tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run crawler
        run: python scripts/crawler.py --live

      - name: Validate generated content
        run: node scripts/validate-content.mjs

      - name: Detect material changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/grants.json data/updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/grants.json data/updates.json
          git commit -m "data: refresh grants $(date +'%Y-%m-%d')"
          git push

      - name: Trigger Cloudflare deploy hook
        if: steps.changes.outputs.changed == 'true' && env.CF_DEPLOY_HOOK_URL != ''
        run: curl --fail --show-error --silent -X POST "$CF_DEPLOY_HOOK_URL"
