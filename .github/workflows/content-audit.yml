name: content-freshness-audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/content-audit.yml"
      - "data/grants.json"
      - "scripts/audit-freshness.mjs"
      - "scripts/audit-quality.mjs"
      - "scripts/audit-indexability.mjs"
      - "scripts/audit-planner.mjs"
      - "scripts/content-audit/**"
      - "tests/content-freshness.test.mjs"
      - "tests/content-quality.test.mjs"
      - "tests/*.test.mjs"
      - "lib/ads/**"
      - "lib/grants/index-policy-core.*"
      - "lib/planner/**"
      - "components/planner/**"
      - "app/planner/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content data
        run: npm run validate:data

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit indexability policy
        run: npm run audit:indexability

      - name: Audit scholarship planner policy
        run: npm run audit:planner

      - name: Run content tests
        run: npm run test:content

      - name: Write freshness report
        shell: bash
        run: node scripts/audit-freshness.mjs --format markdown --strict >> "$GITHUB_STEP_SUMMARY"

      - name: Write quality report
        shell: bash
        run: node scripts/audit-quality.mjs --format markdown --strict >> "$GITHUB_STEP_SUMMARY"
