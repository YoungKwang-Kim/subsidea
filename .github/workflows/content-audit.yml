name: content-freshness-audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/content-audit.yml"
      - "data/grants.json"
      - "scripts/audit-freshness.mjs"
      - "scripts/audit-review-queue.mjs"
      - "scripts/audit-quality.mjs"
      - "scripts/audit-indexability.mjs"
      - "scripts/audit-planner.mjs"
      - "scripts/content-audit/**"
      - "tests/content-freshness.test.mjs"
      - "tests/content-quality.test.mjs"
      - "tests/*.test.mjs"
      - "lib/ads/**"
      - "lib/grants/index-policy-core.*"
      - "lib/planner/**"
      - "components/planner/**"
      - "app/planner/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content data
        run: npm run validate:data

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit indexability policy
        run: npm run audit:indexability

      - name: Audit scholarship planner policy
        run: npm run audit:planner

      - name: Run content tests
        run: npm run test:content

      - name: Generate freshness review queue
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/audit-review-queue.mjs --format markdown --output artifacts/freshness-review-queue.md
          node scripts/audit-review-queue.mjs --format json --output artifacts/freshness-review-queue.json
          cat artifacts/freshness-review-queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload freshness review queue
        uses: actions/upload-artifact@v4
        with:
          name: freshness-review-queue
          path: artifacts/freshness-review-queue.*
          retention-days: 30

      - name: Sync freshness review issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "[운영] 지원금 콘텐츠 최신성 검토 대기열";
            const report = JSON.parse(
              fs.readFileSync("artifacts/freshness-review-queue.json", "utf8"),
            );
            const markdown = fs.readFileSync(
              "artifacts/freshness-review-queue.md",
              "utf8",
            );
            const compactReport = markdown.split("\n## 확인할 공식 출처")[0];
            const body = [
              compactReport,
              "",
              "전체 공식 출처 목록은 이 워크플로우 실행의 `freshness-review-queue` 산출물에서 확인하세요.",
              "",
              `자동 갱신: ${new Date().toISOString()}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (report.summary.total === 0) {
              if (existing?.state === "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  body,
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "open",
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Write freshness report
        shell: bash
        run: node scripts/audit-freshness.mjs --format markdown --strict >> "$GITHUB_STEP_SUMMARY"

      - name: Write quality report
        shell: bash
        run: node scripts/audit-quality.mjs --format markdown --strict >> "$GITHUB_STEP_SUMMARY"
